<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="One step at a time. 一歩ずつ. From the first sketch to the final build."><title>One step at a time. 一歩ずつ. From the first sketch to the final build.</title><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101728"/><stop offset="1" stop-color="#090D1B"/></linearGradient><radialGradient id="halo"><stop stop-color="#66E3ED" stop-opacity=".14"/><stop offset="1" stop-color="#090D1B" stop-opacity="0"/></radialGradient><clipPath id="frame"><rect width="1200" height="240" rx="20"/></clipPath></defs><style>@keyframes breathe{50%{opacity:.45}}@keyframes trace{to{stroke-dashoffset:-96}}.pulse{animation:breathe 4s ease-in-out infinite}.trace{animation:trace 12s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect x="0.5" y="0.5" width="1199" height="239" rx="20" fill="url(#wash)" stroke="#253149"/><ellipse cx="1052" cy="145" rx="350" ry="220" fill="url(#halo)"/><text x="36" y="45" font-family="'Cascadia Code','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" font-weight="600" fill="#66E3ED" >THE STORY CONTINUES</text><text x="36" y="113" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="54" font-weight="700" fill="#F1F4FF" >One step at a time.</text><text x="39" y="158" font-family="'Segoe UI','Noto Sans',Arial,sans-serif" font-size="22" font-weight="400" fill="#9CAAC3" >一歩ずつ  /  From the first sketch to the final build.</text><path d="M38 204 H1160" stroke="#253149"/><path d="M38 204 H1160" stroke="#66E3ED" stroke-width="2" stroke-dasharray="8 88" class="trace"/><path d="M1088 71 Q1090 98 1117 100 Q1090 102 1088 129 Q1086 102 1059 100 Q1086 98 1088 71Z" fill="#66E3ED"/><path d="M1026 134 Q1028 145 1039 147 Q1028 149 1026 160 Q1024 149 1013 147 Q1024 145 1026 134Z" fill="#B8A2FF"/></g></svg>
