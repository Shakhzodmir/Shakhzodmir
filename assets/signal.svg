<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-label="Creative process: think, design, build, ship"><title>Creative process: think, design, build, ship</title><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101728"/><stop offset="1" stop-color="#090D1B"/></linearGradient><radialGradient id="halo"><stop stop-color="#66E3ED" stop-opacity=".14"/><stop offset="1" stop-color="#090D1B" stop-opacity="0"/></radialGradient><clipPath id="frame"><rect width="1200" height="76" rx="20"/></clipPath></defs><style>@keyframes breathe{50%{opacity:.45}}@keyframes trace{to{stroke-dashoffset:-96}}.pulse{animation:breathe 4s ease-in-out infinite}.trace{animation:trace 12s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect x="0.5" y="0.5" width="1199" height="75" rx="20" fill="url(#wash)" stroke="#253149"/><text x="28" y="45" font-family="'Cascadia Code','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" font-weight="600" fill="#9CAAC3" >CREATIVE SYSTEM</text><text x="330" y="45" font-family="'Cascadia Code','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="18" font-weight="600" fill="#9CAAC3" >01 THINK</text><path d="M464 39 h35 m-6 -5 6 5 -6 5" fill="none" stroke="#253149" stroke-width="2"/><text x="540" y="45" font-family="'Cascadia Code','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="18" font-weight="600" fill="#B8A2FF" >02 DESIGN</text><path d="M674 39 h35 m-6 -5 6 5 -6 5" fill="none" stroke="#253149" stroke-width="2"/><text x="750" y="45" font-family="'Cascadia Code','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="18" font-weight="600" fill="#66E3ED" >03 BUILD</text><path d="M884 39 h35 m-6 -5 6 5 -6 5" fill="none" stroke="#253149" stroke-width="2"/><text x="960" y="45" font-family="'Cascadia Code','JetBrains Mono','DejaVu Sans Mono',monospace" font-size="18" font-weight="600" fill="#FF879D" >04 SHIP</text><circle cx="1160" cy="38" r="5" fill="#66E3ED" class="pulse"/></g></svg>
